<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>All Time Top 100 · Ephix Pulse</title>
<meta name="description" content="The hundred best rated films of all time, by genre and by decade.">
<link rel="icon" type="image/png" href="E.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap">
<style>
  :root, [data-theme="dark"] {
    --bg: #080a0f; --surface: #0e1118; --surface2: #131620; --border: #1c2030;
    --accent: #7eb8d4; --accent2: #ff4757; --accent3: #38d9a9;
    --text: #e8eaf0; --muted: #5a6080; --card-hover: #141824;
    --tmdb: #01d277; --hero: #2196f3; --modal-bg: #0e1118;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "DM Sans", sans-serif; font-weight: 300;
    min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    position: sticky; top: 0; z-index: 100;
    padding: 0 clamp(16px, 4vw, 48px);
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; gap: 16px;
  }
  header::before {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: rgba(8, 10, 15, 0.94);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    font-family: "Bebas Neue", sans-serif; font-size: 28px; letter-spacing: 0.12em;
    color: var(--text); flex-shrink: 0; text-decoration: none;
    animation: logo-breathe 4s ease-in-out infinite;
    cursor: pointer; transition: transform 0.2s ease;
  }
  .logo:hover {
    animation: logo-rapid 0.45s steps(2, jump-none) infinite;
    transform: scale(1.02);
  }
  .logo span {
    display: inline-block; color: var(--muted); font-size: 10px;
    font-family: "DM Sans", sans-serif; font-weight: 300; letter-spacing: 0.06em;
    margin-left: 10px; vertical-align: middle; line-height: 1.3;
    text-shadow: none; animation: none;
  }
  @keyframes logo-rapid {
    0%, 100% {
      color: #2196f3;
      text-shadow: 0 0 6px rgba(33,150,243,.5), 0 0 16px rgba(33,150,243,.25);
    }
    50% {
      color: #fff;
      text-shadow: 0 0 14px #fff, 0 0 38px rgba(100,190,255,.95),
                   0 0 80px rgba(33,150,243,.8), 0 0 140px rgba(33,130,243,.45);
    }
  }
  @keyframes logo-breathe {
    0%, 100% {
      color: #2196f3;
      text-shadow: 0 0 8px rgba(33,150,243,.6), 0 0 22px rgba(33,150,243,.35),
                   0 0 50px rgba(33,150,243,.18);
    }
    50% {
      color: #f0f8ff;
      text-shadow: 0 0 10px rgba(255,255,255,.95), 0 0 28px rgba(100,190,255,.85),
                   0 0 60px rgba(33,150,243,.65), 0 0 110px rgba(33,130,243,.35),
                   0 0 180px rgba(20,100,230,.18);
    }
  }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  /* Companion back to the Live Top 100, in the headline face at half height
     sharing the title's baseline. Mirrors the All Time link on the main page. */
  .live-link {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(16px, 2.5vw, 32px);
    letter-spacing: 0.04em; line-height: 1;
    color: var(--muted); text-decoration: none;
    vertical-align: baseline; margin-left: 16px; white-space: nowrap;
    transition: color 0.2s ease;
  }
  .live-link:hover { color: var(--accent); }
  @media (max-width: 640px) { .live-link { margin-left: 10px; } }
  @media (max-width: 640px) {
    header { height: 56px; gap: 10px; padding: 0 14px; }
    .logo { font-size: 22px; min-width: 0; overflow: hidden; white-space: nowrap; }
    .logo span { display: none; }
  }
  @media (max-width: 520px) {
    .logo span { font-size: 9px; margin-left: 8px; }
  }
  @media (max-width: 600px) {
    header::before { backdrop-filter: none; -webkit-backdrop-filter: none; }
  }

  /* ── Section header ── */
  .section-header {
    padding: 16px clamp(16px, 4vw, 48px) 14px;
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 8px;
  }
  .section-title {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(32px, 5vw, 64px);
    letter-spacing: 0.04em; line-height: 1;
  }
  .section-title em { color: var(--accent); font-style: normal; }
  .count-badge {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }

  /* ── Filters ── */
  .filters { padding: 0 clamp(16px, 4vw, 48px) 16px; display: grid; gap: 8px; }
  .filter-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .filter-row > .label {
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); width: 52px; flex: none;
  }
  .tab-group {
    display: flex; background: var(--surface); border: 1px solid var(--border);
    border-radius: 0; overflow-x: auto; scrollbar-width: none; min-width: 0;
  }
  .tab-group::-webkit-scrollbar { display: none; }
  .tab {
    padding: 8px 18px; font-size: 12px; font-family: "DM Sans", sans-serif;
    letter-spacing: 0.07em; text-transform: uppercase; cursor: pointer;
    border: none; background: 0 0; color: var(--muted);
    transition: all 0.2s; white-space: nowrap;
  }
  .tab.active { background: var(--accent); color: #fff; font-weight: 500; }
  .tab:not(.active):hover { color: var(--text); background: var(--border); }
  /* Decade labels are pre-cased ("2020s") so the decade s stays lowercase. */
  #decades .tab { text-transform: none; }

  /* ── Status message ── */
  #msg {
    padding: 0 clamp(16px, 4vw, 48px) 14px;
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }

  /* ── Grid ── */
  #grid {
    padding: 0 clamp(16px, 4vw, 48px) 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 2px;
  }
  @media (min-width: 900px)  { #grid { grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); } }
  @media (min-width: 1200px) { #grid { grid-template-columns: repeat(auto-fill, minmax(195px, 1fr)); } }

  /* ── Cards ── */
  .card {
    position: relative; aspect-ratio: 2/3; overflow: hidden;
    background: var(--surface); opacity: 0; transform: translateY(10px);
    animation: fadeUp .35s ease forwards; cursor: pointer;
    content-visibility: auto; contain-intrinsic-size: auto 280px;
  }
  @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
  .card img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .25s cubic-bezier(.25,.46,.45,.94);
  }
  .card:hover img { transform: scale(1.07); }
  .card .noimg {
    width: 100%; height: 100%; display: grid; place-items: center;
    color: var(--muted); font-size: 11px; padding: 12px; text-align: center;
  }
  .card-overlay {
    position: absolute; inset: 0; transition: background .3s;
    background: linear-gradient(to top, rgba(8,10,15,.97) 0, rgba(8,10,15,.45) 38%, transparent 68%);
  }
  .card:hover .card-overlay {
    background: linear-gradient(to top, rgba(8,10,15,.99) 0, rgba(8,10,15,.72) 52%, rgba(8,10,15,.18) 100%);
  }
  .card-rank {
    position: absolute; top: 8px; left: 10px;
    font-family: "Bebas Neue", sans-serif; font-size: 48px; line-height: 1;
    color: rgba(255,255,255,.12); pointer-events: none;
  }
  .card-rank.top3 { color: rgba(126,184,212,.28); }
  .card-type-badge {
    position: absolute; top: 8px; right: 8px;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 3px; font-weight: 500;
    z-index: 3; opacity: 0; transition: opacity 0.25s ease;
  }
  .card:hover .card-type-badge { opacity: 1; }
  .badge-movie { background: rgba(255,71,87,.85); color: #fff; }
  .badge-tv { background: rgba(126,184,212,.85); color: #0a1520; }
  .card-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 12px 11px 13px; }
  .card-title { font-size: 12px; font-weight: 500; line-height: 1.3; margin-bottom: 5px; color: #fff; }
  .card-meta {
    display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted);
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height .15s ease-out, opacity .15s ease-out;
  }
  .card:hover .card-meta { max-height: 30px; opacity: 1; }
  @media (hover: none) { .card-meta { max-height: 30px; opacity: 1; } }
  .card-genres { font-size: 10px; color: var(--muted); opacity: .7; }
  .score { color: var(--accent3); font-weight: 500; }

  /* ── Download button ── */
  .card-dl {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 26px; height: 26px; border-radius: 50%; padding: 0; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.1);
    color: rgba(255,255,255,.65); font-size: 13px; cursor: pointer; transition: all .2s; opacity: 0;
  }
  .card:hover .card-dl, .card-dl.done, .card-dl.fail { opacity: 1; }
  .card-dl:hover { color: #fff; border-color: rgba(255,255,255,.4); }
  .card-dl.done { color: #4caf50; border-color: #4caf50; cursor: default; }
  .card-dl.fail { color: #ff5252; border-color: #ff5252; }
  @media (hover: none) { .card-dl { opacity: 1; } }

  /* Season picker the download button opens on TV cards. */
  .card-seasons {
    position: absolute; inset: auto 6px 6px 6px; z-index: 6;
    background: rgba(10,10,12,.96); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; padding: 10px; color: #fff; font-size: 12px;
    cursor: default; max-height: 85%; overflow: auto;
  }
  .card-seasons .cs-title { font-weight: 600; margin-bottom: 8px; }
  .card-seasons .cs-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .card-seasons label {
    display: inline-flex; align-items: center; gap: 3px; padding: 3px 7px;
    border: 1px solid rgba(255,255,255,.2); border-radius: 999px; cursor: pointer;
  }
  .card-seasons label:has(input:checked) { background: #2196f3; border-color: #2196f3; }
  .card-seasons input { margin: 0; width: 12px; height: 12px; }
  .card-seasons .cs-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .card-seasons .cs-row button {
    font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.25); background: transparent; color: #fff; cursor: pointer;
  }
  .card-seasons .cs-go { background: #2196f3; border-color: #2196f3; }
  .card-seasons .cs-x { margin-left: auto; }

  /* ── Modal ── */
  #modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(5,7,12,.88); backdrop-filter: blur(12px);
    z-index: 500; align-items: center; justify-content: center; padding: 20px;
  }
  #modal-overlay.open { display: flex; }
  #modal {
    background: #0e1118; border: 1px solid #1c2030; border-radius: 10px;
    max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto;
    position: relative; animation: modal-in 0.25s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.96) translateY(10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    background: rgba(255,255,255,.07); border: 1px solid var(--border);
    color: var(--muted); width: 30px; height: 30px; border-radius: 50%;
    font-size: 18px; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: all .2s; z-index: 10; line-height: 1;
  }
  .modal-close:hover { background: rgba(255,255,255,.14); color: var(--text); }
  .modal-top { display: flex; }
  .modal-poster { width: 180px; flex-shrink: 0; overflow: hidden; border-radius: 10px 0 0 0; }
  .modal-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-poster-placeholder {
    width: 100%; min-height: 270px; background: #131620;
    display: flex; align-items: center; justify-content: center; color: #2a3050;
  }
  .modal-hero {
    flex: 1; padding: 24px 22px 20px; display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(135deg, #0f1320, #0b0e18); border-radius: 0 10px 0 0;
  }
  .modal-type-badge {
    font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 3px; font-weight: 500; width: fit-content;
  }
  .modal-title {
    font-family: "Bebas Neue", sans-serif; font-size: clamp(22px, 4vw, 34px);
    letter-spacing: 0.04em; line-height: 1.05; color: #fff;
  }
  .modal-meta { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
  .modal-rating { color: #f5c518; font-weight: 500; }
  .modal-tagline { font-size: 12px; color: var(--muted); font-style: italic; line-height: 1.5; }
  .modal-body {
    padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 16px;
    border-top: 1px solid var(--border);
  }
  .modal-overview { font-size: 13px; color: #b0b8cc; line-height: 1.7; }
  .modal-credits { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .modal-credit-block { display: flex; flex-direction: column; gap: 3px; }
  .modal-credit-label { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  .modal-credit-value { font-size: 12px; color: var(--text); line-height: 1.4; }
  .modal-genres { display: flex; flex-wrap: wrap; gap: 6px; }
  .modal-genre-tag {
    font-size: 10px; padding: 3px 10px; border-radius: 20px;
    background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--muted);
  }
  .modal-links { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 4px; }
  .modal-link {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
    border-radius: 5px; font-size: 12px; font-family: "DM Sans", sans-serif;
    font-weight: 500; text-decoration: none; letter-spacing: 0.04em;
    transition: opacity .2s; cursor: pointer; border: none;
  }
  .modal-link:hover { opacity: .8; }
  .link-tmdb { background: rgba(1,210,119,.15); color: var(--tmdb); border: 1px solid rgba(1,210,119,.3); }
  .link-imdb { background: rgba(201,165,72,.12); color: #f5c518; border: 1px solid rgba(201,165,72,.3); }
  .link-google { background: rgba(255,255,255,.06); color: var(--text); border: 1px solid var(--border); }
  .modal-loading { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 13px; }
  .modal-spinner {
    width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 520px) {
    .modal-poster { width: 110px; }
    .modal-hero { padding: 14px 12px; }
    .modal-body { padding: 14px 12px 20px; }
  }

  /* ── Watch providers ── */
  .modal-watch {
    margin: 0 0 16px; padding: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  }
  .mb-label {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .wp-region { color: var(--muted); font-weight: 600; }
  .wp-logos { display: flex; flex-wrap: wrap; gap: 8px; }
  .wp-logo { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; }
  .wp-none { font-size: 12px; color: var(--muted); }
  .wp-link { display: inline-block; margin-top: 10px; font-size: 11px; color: var(--accent); text-decoration: none; }
  .wp-link:hover { text-decoration: underline; }

  /* ── Trailer ── */
  .trailer-btn {
    display: inline-flex; align-items: center; gap: 7px;
    margin: 12px 0 0; padding: 7px 13px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background .2s, border-color .2s;
  }
  .trailer-btn:hover { background: var(--surface2); border-color: var(--muted); }
  .trailer-embed {
    position: relative; width: 100%; aspect-ratio: 16/9;
    border-radius: 10px; overflow: hidden; background: #000; margin: 0 0 16px;
  }
  .trailer-embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  /* ── Back to top ── */
  #back-to-top {
    position: fixed; bottom: 70px; right: 24px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(14,17,24,.9); border: 1px solid rgba(33,150,243,.4);
    color: #2196f3; display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 300;
    opacity: 0; visibility: hidden; transform: translateY(10px);
    transition: opacity .3s ease, transform .3s ease, visibility .3s, box-shadow .3s ease;
    backdrop-filter: blur(8px); padding: 0;
  }
  #back-to-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
  #back-to-top:hover {
    background: rgba(33,150,243,.18);
    box-shadow: 0 0 16px rgba(33,150,243,.6), 0 0 36px rgba(33,150,243,.3), 0 0 60px rgba(33,150,243,.15);
    animation: btt-burst .5s ease-out;
  }
  @keyframes btt-burst {
    0%   { box-shadow: 0 0 4px rgba(33,150,243,.3); }
    50%  { box-shadow: 0 0 24px rgba(33,150,243,.9), 0 0 50px rgba(33,150,243,.5), 0 0 80px rgba(33,150,243,.25); }
    100% { box-shadow: 0 0 16px rgba(33,150,243,.6), 0 0 36px rgba(33,150,243,.3); }
  }
  @media (max-width: 600px) {
    #back-to-top { bottom: 70px; right: 16px; width: 40px; height: 40px; }
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/" title="Back to Live Top 100">EPHIX PULSE<span>What the World is Watching<br>Live TV &amp; Movie Trending Aggregator</span></a>
</header>

<div class="section-header">
  <div class="section-title"><em>All Time</em> Top 100<a class="live-link" href="/">&larr; Live Top 100</a></div>
  <span class="count-badge" id="count-badge"></span>
</div>

<div class="filters">
  <div class="filter-row"><span class="label">Type</span><div class="tab-group" id="types"></div></div>
  <div class="filter-row"><span class="label">Genre</span><div class="tab-group" id="genres"></div></div>
  <div class="filter-row"><span class="label">Decade</span><div class="tab-group" id="decades"></div></div>
</div>

<div id="msg">Loading&hellip;</div>
<div id="grid"></div>

<div id="modal-overlay" onclick="if (event.target === this) closeModal();">
  <div id="modal">
    <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<button id="back-to-top" onclick="scrollToTop()" aria-label="Back to top" title="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<script>
const TMDB = '/api/tmdb';
const IMG = 'https://image.tmdb.org/t/p/w342';
const HOME_DL = 'https://download.ephix.net';
const GENRE_MAP = {
  28:'Action', 10759:'Action & Adv', 12:'Adventure', 16:'Animation',
  35:'Comedy', 80:'Crime', 99:'Documentary', 18:'Drama', 10751:'Family',
  14:'Fantasy', 36:'History', 27:'Horror', 9648:'Mystery', 10749:'Romance',
  878:'Sci-Fi', 53:'Thriller', 10752:'War', 37:'Western',
  10762:'Kids', 10763:'News', 10764:'Reality', 10765:'Sci-Fi & Fantasy',
  10766:'Soap', 10767:'Talk', 10768:'War & Politics',
};

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const TYPES = [['movie', 'Film'], ['tv', 'TV']];
const GENRES_MOVIE = [
  ['', 'All'], ['28','Action'], ['12','Adventure'], ['16','Animation'], ['35','Comedy'],
  ['80','Crime'], ['99','Documentary'], ['18','Drama'], ['10751','Family'], ['14','Fantasy'],
  ['36','History'], ['27','Horror'], ['9648','Mystery'], ['10749','Romance'],
  ['878','Sci-Fi'], ['53','Thriller'], ['10752','War'], ['37','Western'],
];
const GENRES_TV = [
  ['', 'All'], ['10759','Action & Adv'], ['16','Animation'], ['35','Comedy'],
  ['80','Crime'], ['99','Documentary'], ['18','Drama'], ['10751','Family'],
  ['10762','Kids'], ['9648','Mystery'], ['10765','Sci-Fi & Fantasy'],
  ['10768','War & Politics'], ['37','Western'],
];
const DECADES = [
  ['', 'ALL'], ['2020','2020s'], ['2010','2010s'], ['2000','2000s'], ['1990','1990s'],
  ['1980','1980s'], ['1970','1970s'], ['1960','1960s'], ['1950','1950s'], ['1930','PRE-1950'],
];

let mediaType = 'movie';
let genre = '';
let decade = '';
let items = [];
let homeDl = false;
const detailCache = {};

const imgObserver = new IntersectionObserver(
  (entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) {
        e.target.src = e.target.dataset.src;
        delete e.target.dataset.src;
        imgObserver.unobserve(e.target);
      }
    });
  },
  { rootMargin: '600px 0px' },
);

// TV vote counts run well below film, so it needs its own, lower floors.
function minVotes(d) {
  if (mediaType === 'tv') {
    if (!d) return 2000;
    const y = +d;
    if (y >= 2000) return 800;
    if (y >= 1980) return 300;
    return 100;
  }
  if (!d) return 5000;
  const y = +d;
  if (y >= 2000) return 800;
  if (y >= 1980) return 300;
  return 150;
}

function tabs(el, list, current, onPick) {
  list.forEach(([val, label]) => {
    const b = document.createElement('button');
    b.className = 'tab' + (val === current ? ' active' : '');
    b.type = 'button';
    b.textContent = label;
    b.onclick = () => {
      el.querySelectorAll('.tab').forEach((t) => t.classList.remove('active'));
      b.classList.add('active');
      onPick(val);
    };
    el.appendChild(b);
  });
}

function query(page, votes) {
  const dateField = mediaType === 'tv' ? 'first_air_date' : 'primary_release_date';
  const p = new URLSearchParams({
    path: 'discover/' + mediaType,
    sort_by: 'vote_average.desc',
    'vote_count.gte': String(votes),
    include_adult: 'false',
    language: 'en-US',
    page: String(page),
  });
  // Runtime floor drops film shorts, but on TV it filters by episode length and
  // guts the list (episode_run_time is patchy), so it is film-only.
  if (mediaType === 'movie') p.set('with_runtime.gte', '70');
  if (genre) p.set('with_genres', genre);
  if (decade) {
    const end = decade === '1930' ? 1949 : (+decade + 9);
    p.set(dateField + '.gte', decade + '-01-01');
    p.set(dateField + '.lte', end + '-12-31');
  }
  return TMDB + '?' + p.toString();
}

function buildCard(item, idx) {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;
  card.style.animationDelay = Math.min(idx * 14, 500) + 'ms';

  const title = item.title || item.name || 'Untitled';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  const rating = item.vote_average ? item.vote_average.toFixed(1) : '';
  const genres = (item.genre_ids || []).slice(0, 2).map((id) => GENRE_MAP[id]).filter(Boolean).join(' · ');
  const poster = item.poster_path
    ? IMG + item.poster_path
    : item.backdrop_path
      ? 'https://image.tmdb.org/t/p/w780' + item.backdrop_path
      : null;

  if (poster) {
    const img = document.createElement('img');
    img.dataset.src = poster;
    img.alt = title;
    img.decoding = 'async';
    img.onerror = () => img.replaceWith(noPosterEl(title));
    card.appendChild(img);
    imgObserver.observe(img);
  } else {
    card.appendChild(noPosterEl(title));
  }

  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  card.appendChild(overlay);

  const rankEl = document.createElement('div');
  rankEl.className = 'card-rank' + (idx < 3 ? ' top3' : '');
  rankEl.textContent = idx + 1;
  card.appendChild(rankEl);

  const badge = document.createElement('div');
  badge.className = 'card-type-badge ' + (mediaType === 'movie' ? 'badge-movie' : 'badge-tv');
  badge.textContent = mediaType === 'movie' ? 'Film' : 'TV';
  card.appendChild(badge);

  const info = document.createElement('div');
  info.className = 'card-info';
  info.innerHTML =
    '<div class="card-title">' + esc(title) + '</div>' +
    '<div class="card-meta">' +
      '<span class="score">' + rating + '</span>' +
      (year ? '<span>' + year + '</span>' : '') +
    '</div>' +
    (genres ? '<div class="card-genres">' + genres + '</div>' : '');
  card.appendChild(info);

  card.addEventListener('click', () => openModal(item));
  return card;
}

function noPosterEl(title) {
  const div = document.createElement('div');
  div.className = 'noimg';
  div.innerHTML = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">' +
    '<rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 8h10M7 12h6"/></svg>' +
    '<span>' + esc(title) + '</span>';
  return div;
}

async function fetchAt(votes) {
  const pages = await Promise.all([1, 2, 3, 4, 5].map((p) => fetch(query(p, votes)).then((r) => r.json())));
  const err = pages.find((p) => p && p.error);
  if (err) throw new Error(err.error);
  return pages.flatMap((p) => (p && p.results) || []).slice(0, 100);
}

async function load() {
  document.getElementById('msg').textContent = 'Loading…';
  document.getElementById('count-badge').textContent = '';
  const grid = document.getElementById('grid');
  imgObserver.disconnect();
  grid.innerHTML = '';
  try {
    const start = minVotes(decade);
    const ladder = [start, 300, 150, 50, 20].filter((v, i) => i === 0 || v < start);
    let used = start;
    for (const v of ladder) {
      items = await fetchAt(v);
      used = v;
      if (items.length >= 20) break;
    }
    if (!items.length) {
      document.getElementById('msg').textContent = 'Nothing matched that combination. Try a wider decade, or all genres.';
      return;
    }
    const noun = mediaType === 'tv' ? 'shows' : 'films';
    document.getElementById('msg').textContent =
      items.length + ' ' + noun + ' · rated by at least ' + used.toLocaleString() + ' voters'
      + (used < start ? ' · relaxed, this combination is thin' : '');
    document.getElementById('count-badge').textContent =
      items.length + ' title' + (items.length !== 1 ? 's' : '');

    items.forEach((item, i) => {
      item.media_type = mediaType;
      grid.appendChild(buildCard(item, i));
    });
    if (homeDl) addButtons();
  } catch (e) {
    document.getElementById('msg').innerHTML =
      '<span style="color:var(--accent2)">Could not load: ' + esc(e.message || e) + '</span>';
  }
}

/* ── Download at home ── */
(async () => {
  try {
    const r = await fetch(HOME_DL + '/api/me', { credentials: 'include', cache: 'no-store' });
    if (r.ok) { homeDl = true; if (items.length) addButtons(); }
  } catch (_) {}
})();

function addButtons() {
  document.querySelectorAll('#grid .card').forEach((el) => {
    if (el.querySelector('.card-dl')) return;
    const it = items.find((x) => String(x.id) === el.dataset.id);
    if (!it) return;
    const b = document.createElement('button');
    b.className = 'card-dl';
    b.type = 'button';
    b.textContent = '⬇';
    b.title = 'Download at home';
    b.onclick = (e) => { e.stopPropagation(); homeDownload(it, b); };
    el.appendChild(b);
  });
}

// Films add straight away. TV opens a season picker first (latest season
// pre-selected) so a tap on a long-running show never pulls every season.
function homeDownload(item, btn) {
  if (item.media_type === 'tv') return homeSeasonPicker(item, btn);
  return homeAdd(item, btn, { mode: 'all' });
}

async function homeAdd(item, btn, opts) {
  const title = item.title || item.name || '';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);
  btn.disabled = true; btn.textContent = '…'; btn.title = 'Adding at home…';
  try {
    const r = await fetch(HOME_DL + '/api/add', {
      method: 'POST', credentials: 'include',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(Object.assign({ type: item.media_type, tmdbId: item.id, title, year }, opts)),
    }).then((x) => x.json());
    if (r.error) throw new Error(r.error);
    btn.classList.add('done');
    btn.textContent = r.queued ? '⏳' : '✓';
    const what = opts.mode === 'seasons' ? ' (S' + opts.seasons.join(', S') + ' + new episodes)'
      : opts.mode === 'future' ? ' (new episodes only)'
      : opts.mode === 'all' && item.media_type === 'tv' ? ' (all seasons)' : '';
    btn.title = r.queued ? 'Queued, home is offline, it will add when back'
      : r.already ? 'Already in the library at home' : 'Added at home, downloading' + what;
  } catch (e) {
    btn.disabled = false; btn.textContent = '✗'; btn.classList.add('fail');
    btn.title = "Couldn't add: " + (e.message || e) + '. Click to open download.ephix.net';
    btn.onclick = (ev) => { ev.stopPropagation(); window.open(HOME_DL + '/?add=' + item.media_type + ':' + item.id, '_blank'); };
  }
}

async function homeSeasonPicker(item, btn) {
  const card = btn.closest('.card');
  const existing = card.querySelector('.card-seasons');
  if (existing) existing.remove();
  btn.disabled = true; btn.textContent = '…';
  let info;
  try {
    info = await fetch(HOME_DL + '/api/seasons?tmdbId=' + item.id, { credentials: 'include' }).then((x) => x.json());
    if (info.error) throw new Error(info.error);
  } catch (e) {
    btn.disabled = false; btn.textContent = '✗'; btn.classList.add('fail');
    btn.title = "Couldn't load seasons: " + (e.message || e);
    return;
  }
  btn.disabled = false; btn.textContent = '⬇';
  if (info.inLibrary) { btn.classList.add('done'); btn.textContent = '✓'; btn.title = 'Already in the library at home'; return; }
  const last = info.seasons[info.seasons.length - 1];
  const pop = document.createElement('div');
  pop.className = 'card-seasons';
  pop.addEventListener('click', (e) => e.stopPropagation());
  pop.innerHTML =
    '<div class="cs-title">' + esc(info.title) + ' — which seasons?</div>' +
    '<div class="cs-list">' + info.seasons.map((n) =>
      '<label><input type="checkbox" value="' + n + '"' + (n === last ? ' checked' : '') + '>S' + String(n).padStart(2, '0') + '</label>').join('') + '</div>' +
    '<div class="cs-row"><button class="cs-go">Add selected</button><button class="cs-new">New episodes only</button><button class="cs-all">All ' + info.seasons.length + '</button><button class="cs-x" aria-label="Close">×</button></div>';
  const close = () => pop.remove();
  pop.querySelector('.cs-x').onclick = close;
  pop.querySelector('.cs-go').onclick = () => {
    const picked = [...pop.querySelectorAll('input:checked')].map((i) => Number(i.value));
    if (!picked.length) return;
    close(); homeAdd(item, btn, { mode: 'seasons', seasons: picked });
  };
  pop.querySelector('.cs-new').onclick = () => { close(); homeAdd(item, btn, { mode: 'future' }); };
  pop.querySelector('.cs-all').onclick = () => {
    if (confirm('Add all ' + info.seasons.length + ' seasons of ' + info.title + '?')) { close(); homeAdd(item, btn, { mode: 'all' }); }
  };
  card.appendChild(pop);
}

/* ── Modal ── */
async function openModal(item) {
  const overlay = document.getElementById('modal-overlay');
  const modalContent = document.getElementById('modal-content');
  const type = item.media_type;
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  try {
    const slug = String(item.title || item.name || '').toLowerCase().normalize('NFKD')
      .replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
    const newUrl = window.location.pathname + '#' + (slug ? slug + '-' : '') + type + '-' + item.id;
    window.history.pushState({ modal: true, id: item.id, type }, '', newUrl);
  } catch (_) {}

  modalContent.innerHTML = '<div class="modal-loading"><div class="modal-spinner"></div>Loading details…</div>';
  const cacheKey = type + '_' + item.id;
  let detail, credits;
  try {
    if (detailCache[cacheKey]) {
      ({ detail, credits } = detailCache[cacheKey]);
    } else {
      const append = type === 'tv' ? '&append_to_response=videos,external_ids' : '&append_to_response=videos';
      const [d, c, w] = await Promise.all([
        fetch(TMDB + '?path=' + type + '/' + item.id + append).then((r) => r.json()),
        fetch(TMDB + '?path=' + type + '/' + item.id + '/credits').then((r) => r.json()),
        fetch(TMDB + '?path=' + type + '/' + item.id + '/watch/providers').then((r) => r.json()).catch(() => null),
      ]);
      detail = d; credits = c;
      if (detail) detail._watch = w;
      detailCache[cacheKey] = { detail, credits };
    }
  } catch (err) {
    modalContent.innerHTML = '<div class="modal-loading">Failed to load details</div>';
    return;
  }
  renderModal(item, detail, credits);
}

function viewerRegion() {
  try { const r = new Intl.Locale(navigator.language).region; if (r) return r; } catch (_) {}
  const p = (navigator.language || '').split('-')[1];
  return p ? p.toUpperCase() : 'US';
}

function watchHTML(detail) {
  const w = detail && detail._watch && detail._watch.results;
  if (!w) return '';
  const region = viewerRegion();
  const data = w[region];
  if (!data) return '';
  const flat = data.flatrate || [];
  const hasRentBuy = (data.rent && data.rent.length) || (data.buy && data.buy.length);
  if (!flat.length && !hasRentBuy) return '';
  const WP = 'https://image.tmdb.org/t/p/w92';
  const logos = flat.slice(0, 8).map((p) =>
    '<img class="wp-logo" src="' + WP + p.logo_path + '" alt="' + esc(p.provider_name) +
    '" title="' + esc(p.provider_name) + '">').join('');
  const body = flat.length
    ? '<div class="wp-logos">' + logos + '</div>'
    : '<div class="wp-none">Rent or buy only in your region</div>';
  return '<div class="modal-watch"><div class="mb-label">Where to watch <span class="wp-region">' +
    esc(region) + '</span></div>' + body +
    (data.link ? '<a class="wp-link" href="' + data.link + '" target="_blank" rel="noopener">All options on JustWatch ↗</a>' : '') +
    '</div>';
}

function pickTrailer(detail) {
  const vids = (detail.videos && detail.videos.results) || [];
  const yt = vids.filter((v) => v.site === 'YouTube' && v.key);
  if (!yt.length) return null;
  const score = (v) => (v.type === 'Trailer' ? 2 : v.type === 'Teaser' ? 1 : 0) + (v.official ? 0.5 : 0);
  yt.sort((a, b) => score(b) - score(a));
  return yt[0];
}

function trailerBtn(detail) {
  const v = pickTrailer(detail);
  if (!v) return '';
  return '<button class="trailer-btn" type="button" onclick="toggleTrailer(this)" data-key="' + v.key + '">▶ Watch trailer</button>';
}

function trailerEmbed(detail) {
  return pickTrailer(detail) ? '<div class="trailer-embed" id="trailer-embed" style="display:none"></div>' : '';
}

function toggleTrailer(btn) {
  const embed = document.getElementById('trailer-embed');
  if (!embed) return;
  if (embed.style.display === 'none') {
    embed.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + btn.dataset.key +
      '?autoplay=1&rel=0" title="Trailer" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    embed.style.display = '';
    btn.textContent = '▲ Hide trailer';
  } else {
    embed.innerHTML = '';
    embed.style.display = 'none';
    btn.textContent = '▶ Watch trailer';
  }
}

function stopTrailer() {
  const e = document.getElementById('trailer-embed');
  if (e) { e.innerHTML = ''; e.style.display = 'none'; }
  const b = document.querySelector('.trailer-btn');
  if (b) b.textContent = '▶ Watch trailer';
}

function renderModal(item, detail, credits) {
  const type = item.media_type;
  const isTv = type === 'tv';
  const title = detail.title || detail.name || item.title || item.name || 'Untitled';
  const tagline = detail.tagline || '';
  const overview = detail.overview || 'No synopsis available.';
  const rawDate = detail.release_date || detail.first_air_date || '';
  const year = rawDate.slice(0, 4);
  const fullDate = rawDate ? (() => {
    const d = new Date(rawDate);
    return isNaN(d.getTime()) ? rawDate : d.toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  })() : null;
  const rating = detail.vote_average ? detail.vote_average.toFixed(1) : null;
  const runtime = detail.runtime || (detail.episode_run_time && detail.episode_run_time[0]);
  const poster = detail.poster_path ? 'https://image.tmdb.org/t/p/w500' + detail.poster_path : null;
  const imdbId = detail.imdb_id || (detail.external_ids && detail.external_ids.imdb_id);
  const genres = (detail.genres || []).map((g) => g.name);
  const director = isTv ? '' : (credits.crew || []).filter((c) => c.job === 'Director').map((c) => c.name).slice(0, 3).join(', ');
  const writers = isTv ? '' : (credits.crew || []).filter((c) => c.department === 'Writing').map((c) => c.name).slice(0, 3).join(', ');
  const creators = isTv ? (detail.created_by || []).map((c) => c.name).slice(0, 3).join(', ') : '';
  const starring = (credits.cast || []).slice(0, 5).map((c) => c.name).join(', ');
  const tmdbUrl = 'https://www.themoviedb.org/' + type + '/' + item.id;
  const imdbUrl = imdbId ? 'https://www.imdb.com/title/' + imdbId : null;
  const googleUrl = 'https://www.google.com/search?q=' + encodeURIComponent(title + ' ' + (year || '') + (isTv ? ' tv series' : ' movie'));

  document.getElementById('modal-content').innerHTML =
    '<div class="modal-top">' +
      '<div class="modal-poster">' +
        (poster
          ? '<img src="' + poster + '" alt="' + esc(title) + '">'
          : '<div class="modal-poster-placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M7 8h10M7 12h6"/></svg></div>') +
      '</div>' +
      '<div class="modal-hero">' +
        '<span class="modal-type-badge ' + (isTv ? 'badge-tv' : 'badge-movie') + '">' + (isTv ? 'TV Series' : 'Film') + '</span>' +
        '<div class="modal-title">' + esc(title) + '</div>' +
        '<div class="modal-meta">' +
          (rating ? '<span class="modal-rating">★ ' + rating + '</span>' : '') +
          (fullDate ? '<span>' + fullDate + '</span>' : year ? '<span>' + year + '</span>' : '') +
          (runtime ? '<span>' + runtime + ' min</span>' : '') +
        '</div>' +
        (tagline ? '<div class="modal-tagline">"' + esc(tagline) + '"</div>' : '') +
        trailerBtn(detail) +
      '</div>' +
    '</div>' +
    '<div class="modal-body">' +
      trailerEmbed(detail) +
      watchHTML(detail) +
      '<div class="modal-overview">' + esc(overview) + '</div>' +
      (genres.length ? '<div class="modal-genres">' + genres.map((g) => '<span class="modal-genre-tag">' + esc(g) + '</span>').join('') + '</div>' : '') +
      '<div class="modal-credits">' +
        (director ? '<div class="modal-credit-block"><span class="modal-credit-label">Director</span><span class="modal-credit-value">' + esc(director) + '</span></div>' : '') +
        (writers ? '<div class="modal-credit-block"><span class="modal-credit-label">Writer' + (writers.includes(',') ? 's' : '') + '</span><span class="modal-credit-value">' + esc(writers) + '</span></div>' : '') +
        (creators ? '<div class="modal-credit-block"><span class="modal-credit-label">Creator' + (creators.includes(',') ? 's' : '') + '</span><span class="modal-credit-value">' + esc(creators) + '</span></div>' : '') +
        (starring ? '<div class="modal-credit-block" style="grid-column:1/-1"><span class="modal-credit-label">Starring</span><span class="modal-credit-value">' + esc(starring) + '</span></div>' : '') +
      '</div>' +
      '<div class="modal-links">' +
        '<a class="modal-link link-tmdb" href="' + tmdbUrl + '" target="_blank" rel="noopener">↗ TMDB</a>' +
        (imdbUrl ? '<a class="modal-link link-imdb" href="' + imdbUrl + '" target="_blank" rel="noopener">↗ IMDb</a>' : '') +
        '<a class="modal-link link-google" href="' + googleUrl + '" target="_blank" rel="noopener">↗ Google</a>' +
      '</div>' +
    '</div>';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  stopTrailer();
  try {
    if (window.location.hash) window.history.pushState({}, '', window.location.pathname);
  } catch (_) {}
}

window.addEventListener('popstate', () => {
  const overlay = document.getElementById('modal-overlay');
  if (overlay.classList.contains('open')) {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    stopTrailer();
  }
  checkUrlForModal();
});
window.addEventListener('hashchange', checkUrlForModal);

function checkUrlForModal() {
  const t = (window.location.hash || '').replace(/^#/, '');
  if (!t) return;
  const match = t.match(/(movie|tv)-(\d+)$/);
  if (!match) return;
  const id = parseInt(match[2], 10);
  const item = items.find((i) => i.id === id);
  if (item) openModal(item);
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ── Back to top ── */
function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
window.addEventListener('scroll', () => {
  const btn = document.getElementById('back-to-top');
  if (!btn) return;
  if (window.scrollY > 400) btn.classList.add('visible');
  else btn.classList.remove('visible');
}, { passive: true });

/* ── Init ── */
// Genre IDs differ between film and TV, so switching type rebuilds the genre
// row and resets the selection to All.
function renderGenreTabs() {
  const el = document.getElementById('genres');
  el.innerHTML = '';
  tabs(el, mediaType === 'tv' ? GENRES_TV : GENRES_MOVIE, genre, (v) => { genre = v; load(); });
}

tabs(document.getElementById('types'), TYPES, mediaType, (v) => {
  mediaType = v;
  genre = '';
  renderGenreTabs();
  load();
});
renderGenreTabs();
tabs(document.getElementById('decades'), DECADES, decade, (v) => { decade = v; load(); });
load();
</script>
